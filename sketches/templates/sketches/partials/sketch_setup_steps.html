<ol class="sketch-setup-steps" aria-label="Sketch setup progress">
  <li class="sketch-setup-step{% if step >= 1 %} is-active{% endif %}{% if step > 1 %} is-complete{% endif %}">
    <span class="sketch-setup-step-marker">1</span>
    <span class="sketch-setup-step-label">Code</span>
  </li>
  <li class="sketch-setup-step{% if step >= 2 %} is-active{% endif %}">
    <span class="sketch-setup-step-marker">2</span>
    <span class="sketch-setup-step-label">Details</span>
  </li>
</ol>
