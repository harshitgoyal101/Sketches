<button
  type="button"
  class="gallery-theme-toggle"
  data-theme-toggle
  aria-label="Switch to light theme"
>
  <span class="gallery-theme-toggle-track" aria-hidden="true">
    <span class="gallery-theme-toggle-thumb"></span>
    <span class="gallery-theme-toggle-seg gallery-theme-toggle-seg--light">
      <span class="material-symbols-outlined">light_mode</span>
    </span>
    <span class="gallery-theme-toggle-seg gallery-theme-toggle-seg--dark">
      <span class="material-symbols-outlined">dark_mode</span>
    </span>
  </span>
</button>
