<aside class="fixed left-0 top-[6.5rem] bottom-0 flex flex-col w-sidebar-width z-40 bg-white border-r border-primary/5 hidden xl:flex">
  <div class="p-6 flex flex-col h-full">
    <div class="flex items-center gap-3 mb-8">
      <div class="w-10 h-10 bg-primary-container rounded flex items-center justify-center">
        <span class="material-symbols-outlined text-white">code_blocks</span>
      </div>
      <div>
        <h3 class="font-display-lg text-headline-md text-on-surface leading-none">Workspace</h3>
        <p class="text-label-sm font-label-sm text-outline uppercase tracking-widest mt-1">Creative Engine</p>
      </div>
    </div>

    {% if user.is_authenticated %}
    <a href="{% url 'sketch_create' %}" class="w-full bg-primary-container text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 mb-8 hover:bg-primary transition-all shadow-lg shadow-primary/20 active:scale-[0.98]">
      <span class="material-symbols-outlined">add</span>
      New Sketch
    </a>
    {% else %}
    <a href="{% url 'signup' %}" class="w-full bg-primary-container text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 mb-8 hover:bg-primary transition-all shadow-lg shadow-primary/20 active:scale-[0.98]">
      <span class="material-symbols-outlined">add</span>
      Get Started
    </a>
    {% endif %}

    <nav class="space-y-1">
      <a
        href="{% url 'home' %}"
        class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all group {% if request.resolver_match.url_name == 'home' %}bg-primary-fixed text-on-primary-fixed-variant border-l-4 border-primary rounded-r-lg{% else %}text-outline hover:text-primary hover:bg-primary/5{% endif %}"
      >
        <span class="material-symbols-outlined{% if request.resolver_match.url_name == 'home' %} is-filled{% endif %}">home</span>
        <span class="font-code-md text-code-md{% if request.resolver_match.url_name == 'home' %} font-bold{% endif %}">Home</span>
      </a>
      <a
        href="{% url 'sketch_list' %}"
        class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all group {% if request.resolver_match.url_name == 'sketch_list' or request.resolver_match.url_name == 'tag_detail' or request.resolver_match.url_name == 'sketch_detail' %}bg-primary-fixed text-on-primary-fixed-variant border-l-4 border-primary rounded-r-lg{% else %}text-outline hover:text-primary hover:bg-primary/5{% endif %}"
      >
        <span class="material-symbols-outlined{% if request.resolver_match.url_name == 'sketch_list' or request.resolver_match.url_name == 'tag_detail' or request.resolver_match.url_name == 'sketch_detail' %} is-filled{% endif %}">folder_open</span>
        <span class="font-code-md text-code-md{% if request.resolver_match.url_name == 'sketch_list' or request.resolver_match.url_name == 'tag_detail' or request.resolver_match.url_name == 'sketch_detail' %} font-bold{% endif %}">Discovery</span>
      </a>
      {% if user.is_authenticated %}
      <a
        href="{% url 'account' %}"
        class="flex items-center gap-3 px-4 py-3 rounded-lg transition-all {% if request.resolver_match.url_name == 'account' or request.resolver_match.url_name == 'sketch_edit' or request.resolver_match.url_name == 'sketch_create' %}bg-primary-fixed text-on-primary-fixed-variant border-l-4 border-primary rounded-r-lg{% else %}text-outline hover:text-primary hover:bg-primary/5{% endif %}"
      >
        <span class="material-symbols-outlined{% if request.resolver_match.url_name == 'account' or request.resolver_match.url_name == 'sketch_edit' or request.resolver_match.url_name == 'sketch_create' %} is-filled{% endif %}">code_blocks</span>
        <span class="font-code-md text-code-md{% if request.resolver_match.url_name == 'account' or request.resolver_match.url_name == 'sketch_edit' or request.resolver_match.url_name == 'sketch_create' %} font-bold{% endif %}">My Sketches</span>
      </a>
      {% endif %}
    </nav>

    <div class="mt-auto pt-6 border-t border-primary/5">
      <p class="px-4 text-label-sm font-label-sm text-outline uppercase tracking-widest">Sketches101</p>
      <p class="px-4 mt-2 text-sm text-on-surface-variant">Interactive p5.js &amp; Processing gallery.</p>
    </div>
  </div>
</aside>
