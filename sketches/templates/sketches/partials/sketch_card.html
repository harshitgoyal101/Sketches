<article class="sketch-card">
  <a href="{% url 'sketch_detail' sketch.slug %}" class="sketch-card-link">
    <div class="sketch-card-thumb">
      {% if sketch.thumbnail %}
        <img src="{{ sketch.thumbnail.url }}" alt="{{ sketch.title }}" loading="lazy">
      {% else %}
        <span class="sketch-card-placeholder">◌</span>
      {% endif %}
    </div>
    <div class="sketch-card-body">
      <h3>{{ sketch.title }}</h3>
    </div>
  </a>
  <div class="sketch-card-meta">
    {% if sketch.sketch_type == "p5js" %}
      <span class="badge badge-p5js">p5.js</span>
    {% else %}
      <span class="badge badge-processing">Processing</span>
    {% endif %}
    {% if sketch.published_at %}
      <span>{{ sketch.published_at|date:"M j, Y" }}</span>
    {% endif %}
    {% for tag in sketch.tags.all %}
      <a href="{% url 'tag_detail' tag.slug %}" class="tag">{{ tag.name }}</a>
    {% endfor %}
  </div>
</article>
