<section class="landing-section landing-section--elevated landing-stats" aria-label="Platform stats">
  <div class="landing-container landing-stats-grid">
    <div class="landing-stat">
      <p class="landing-stat-value">{{ stats_sketch_count }}{% if stats_sketch_count %}+{% endif %}</p>
      <p class="landing-stat-label">Sketches Created</p>
    </div>
    <div class="landing-stat">
      <p class="landing-stat-value">{{ stats_artist_count }}{% if stats_artist_count %}+{% endif %}</p>
      <p class="landing-stat-label">Generative Artists</p>
    </div>
    <div class="landing-stat">
      <p class="landing-stat-value">{{ stats_format_count }}</p>
      <p class="landing-stat-label">Languages &amp; Frameworks</p>
    </div>
    <div class="landing-stat">
      <p class="landing-stat-value">60FPS</p>
      <p class="landing-stat-label">Optimized Performance</p>
    </div>
  </div>
</section>
