<ol class="password-reset-steps" aria-label="Password reset progress">
  <li class="password-reset-step{% if step >= 1 %} is-active{% endif %}{% if step > 1 %} is-complete{% endif %}">
    <span class="password-reset-step-marker">1</span>
    <span class="password-reset-step-label">Email</span>
  </li>
  <li class="password-reset-step{% if step >= 2 %} is-active{% endif %}{% if step > 2 %} is-complete{% endif %}">
    <span class="password-reset-step-marker">2</span>
    <span class="password-reset-step-label">Sent</span>
  </li>
  <li class="password-reset-step{% if step >= 3 %} is-active{% endif %}{% if step > 3 %} is-complete{% endif %}">
    <span class="password-reset-step-marker">3</span>
    <span class="password-reset-step-label">New password</span>
  </li>
  <li class="password-reset-step{% if step >= 4 %} is-active{% endif %}">
    <span class="password-reset-step-marker">4</span>
    <span class="password-reset-step-label">Done</span>
  </li>
</ol>
