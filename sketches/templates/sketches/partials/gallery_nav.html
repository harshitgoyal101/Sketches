<nav class="flex justify-between items-center w-full px-6 md:px-margin-desktop h-16 fixed z-50 bg-white/80 backdrop-blur-xl border-b border-primary/10 shadow-sm top-0">
  <div class="flex items-center gap-4 lg:gap-8 min-w-0">
    <a href="{% url 'home' %}" class="font-display-lg text-headline-md tracking-tighter text-primary shrink-0">Sketches101</a>
    <form class="relative hidden lg:block" method="get" action="{% url 'sketch_list' %}">
      {% if tag_slug %}<input type="hidden" name="tag" value="{{ tag_slug }}">{% endif %}
      {% if sketch_type %}<input type="hidden" name="type" value="{{ sketch_type }}">{% endif %}
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">search</span>
      <input
        id="gallery-search"
        class="bg-surface-container-lowest border border-outline-variant rounded-lg pl-10 pr-4 py-1.5 w-64 focus:outline-none focus:border-primary transition-all text-code-md font-code-md"
        name="q"
        value="{{ query }}"
        placeholder="Search creative code..."
        type="search"
      >
    </form>
  </div>

  <div class="hidden md:flex items-center gap-6 lg:gap-8">
    <a
      href="{% url 'home' %}"
      class="{% if request.resolver_match.url_name == 'home' %}text-primary font-bold border-b-2 border-primary pb-1{% else %}text-on-surface-variant hover:text-primary{% endif %} transition-colors font-body-md text-body-md"
    >Home</a>
    <a
      href="{% url 'sketch_list' %}"
      class="{% if request.resolver_match.url_name == 'sketch_list' or request.resolver_match.url_name == 'tag_detail' or request.resolver_match.url_name == 'sketch_detail' %}text-primary font-bold border-b-2 border-primary pb-1{% else %}text-on-surface-variant hover:text-primary{% endif %} transition-colors font-body-md text-body-md"
    >Gallery</a>
    {% if user.is_authenticated %}
    <a
      href="{% url 'account' %}"
      class="{% if request.resolver_match.url_name == 'account' or request.resolver_match.url_name == 'sketch_edit' or request.resolver_match.url_name == 'sketch_create' %}text-primary font-bold border-b-2 border-primary pb-1{% else %}text-on-surface-variant hover:text-primary{% endif %} transition-colors font-body-md text-body-md"
    >Account</a>
    {% else %}
    <a
      href="{% url 'login' %}"
      class="{% if request.resolver_match.url_name == 'login' %}text-primary font-bold border-b-2 border-primary pb-1{% else %}text-on-surface-variant hover:text-primary{% endif %} transition-colors font-body-md text-body-md hidden sm:inline"
    >Log in</a>
    {% endif %}
  </div>

  <div class="flex items-center gap-2 md:gap-4 shrink-0">
    {% if user.is_authenticated %}
    <a href="{% url 'sketch_create' %}" class="hidden sm:inline-flex bg-primary-container text-white font-bold px-4 py-2 rounded-lg items-center gap-1 hover:bg-primary transition-all shadow-lg shadow-primary/20 text-sm">
      <span class="material-symbols-outlined text-base">add</span>
      New
    </a>
    <a href="{% url 'account' %}" class="w-8 h-8 rounded-full overflow-hidden border border-primary/20 bg-primary-fixed flex items-center justify-center text-on-primary-fixed-variant font-bold text-sm" title="{{ user.username }}">
      {{ user.username|slice:":1"|upper }}
    </a>
    {% else %}
    <a href="{% url 'login' %}" class="text-on-surface-variant hover:text-primary transition-colors font-body-md text-sm hidden sm:inline">Log in</a>
    <a href="{% url 'signup' %}" class="bg-primary-container text-white font-bold px-4 py-2 rounded-lg hover:bg-primary transition-all text-sm">Sign up</a>
    {% endif %}
  </div>
</nav>
