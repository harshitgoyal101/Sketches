<nav class="gallery-home-nav" aria-label="Site">
  <a href="{% url 'home' %}" class="gallery-home-nav-brand" aria-label="Sketches101">
    {% include "sketches/partials/site_logo.html" %}
  </a>
  <div class="gallery-home-nav-links">
    {% if user.is_authenticated %}
    <form method="post" action="{% url 'logout' %}" class="gallery-home-nav-logout-form">
      {% csrf_token %}
      <button type="submit" class="gallery-home-nav-btn">Log out</button>
    </form>
    {% else %}
    <a href="{% url 'login' %}" class="gallery-home-nav-btn">Log in</a>
    {% endif %}
    <a href="{% url 'sketch_list' %}" class="gallery-home-nav-btn gallery-home-nav-btn--accent">Gallery</a>
  </div>
</nav>
