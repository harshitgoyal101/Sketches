<div class="sketch-detail-preview{% if sketch.is_interactive %} sketch-detail-preview--interactive{% endif %}" id="preview-frame-wrap">
  {% if sketch.is_interactive %}
  <div class="sketch-detail-preview-stage">
    <iframe
      id="sketch-preview"
      src="{% url 'sketch_embed' sketch.slug %}"
      sandbox="allow-scripts allow-same-origin"
      loading="lazy"
      title="{{ sketch.title }} preview"
    ></iframe>
  </div>
  <div class="sketch-detail-preview-chrome" aria-label="Preview controls">
    <p class="sketch-detail-preview-hint">
      <span class="material-symbols-outlined" aria-hidden="true">touch_app</span>
      <span>Drag to interact</span>
    </p>
    <div class="sketch-detail-preview-controls">
      <button
        type="button"
        id="restart-preview"
        class="preview-toolbar-btn"
        title="Restart sketch"
        aria-label="Restart sketch"
      >
        <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
      </button>
      <button
        type="button"
        id="fullscreen-preview"
        class="preview-toolbar-btn"
        title="Fullscreen preview"
        aria-label="Fullscreen preview"
      >
        <span class="material-symbols-outlined" aria-hidden="true">fullscreen</span>
      </button>
    </div>
  </div>
  {% elif sketch.thumbnail %}
  <img class="sketch-detail-preview-thumb" src="{{ sketch.thumbnail.url }}" alt="{{ sketch.title }}" loading="lazy">
  {% else %}
  <div class="sketch-detail-preview-placeholder">
    <span class="material-symbols-outlined" aria-hidden="true">play_circle</span>
    <p>No preview available</p>
  </div>
  {% endif %}
</div>
