<div class="md:hidden fixed bottom-0 left-0 w-full h-16 bg-white border-t border-primary/10 z-50 flex items-center justify-around px-4 shadow-lg">
  <a href="{% url 'home' %}" class="flex flex-col items-center justify-center {% if request.resolver_match.url_name == 'home' %}text-primary{% else %}text-outline hover:text-primary{% endif %}">
    <span class="material-symbols-outlined{% if request.resolver_match.url_name == 'home' %} is-filled{% endif %}">home</span>
    <span class="text-[10px] uppercase font-label-sm">Home</span>
  </a>
  <a href="{% url 'sketch_list' %}" class="flex flex-col items-center justify-center {% if request.resolver_match.url_name == 'sketch_list' or request.resolver_match.url_name == 'tag_detail' or request.resolver_match.url_name == 'sketch_detail' %}text-primary{% else %}text-outline hover:text-primary{% endif %}">
    <span class="material-symbols-outlined{% if request.resolver_match.url_name == 'sketch_list' or request.resolver_match.url_name == 'tag_detail' or request.resolver_match.url_name == 'sketch_detail' %} is-filled{% endif %}">explore</span>
    <span class="text-[10px] uppercase font-label-sm">Gallery</span>
  </a>
  {% if user.is_authenticated %}
  <a href="{% url 'sketch_create' %}" class="flex flex-col items-center justify-center {% if request.resolver_match.url_name == 'sketch_create' %}text-primary{% else %}text-outline hover:text-primary{% endif %}">
    <span class="material-symbols-outlined{% if request.resolver_match.url_name == 'sketch_create' %} is-filled{% endif %}">add_box</span>
    <span class="text-[10px] uppercase font-label-sm">Create</span>
  </a>
  <a href="{% url 'account' %}" class="flex flex-col items-center justify-center {% if request.resolver_match.url_name == 'account' or request.resolver_match.url_name == 'sketch_edit' or request.resolver_match.url_name == 'sketch_create' %}text-primary{% else %}text-outline hover:text-primary{% endif %}">
    <span class="material-symbols-outlined{% if request.resolver_match.url_name == 'account' or request.resolver_match.url_name == 'sketch_edit' or request.resolver_match.url_name == 'sketch_create' %} is-filled{% endif %}">person</span>
    <span class="text-[10px] uppercase font-label-sm">Profile</span>
  </a>
  {% else %}
  <a href="{% url 'login' %}" class="flex flex-col items-center justify-center text-outline hover:text-primary">
    <span class="material-symbols-outlined">login</span>
    <span class="text-[10px] uppercase font-label-sm">Log in</span>
  </a>
  <a href="{% url 'signup' %}" class="flex flex-col items-center justify-center text-outline hover:text-primary">
    <span class="material-symbols-outlined">person_add</span>
    <span class="text-[10px] uppercase font-label-sm">Sign up</span>
  </a>
  {% endif %}
</div>
